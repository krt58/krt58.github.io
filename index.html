<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalZone - Canlı Futbol Skorları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: #161d2e;
    --bg-hover: #1e2840;
    --accent: #00e676;
    --accent-dim: #00c864;
    --accent-glow: rgba(0,230,118,0.15);
    --red: #ff4757;
    --yellow: #ffd32a;
    --blue: #3498db;
    --text-primary: #f0f4ff;
    --text-secondary: #8892aa;
    --text-muted: #4a5568;
    --border: rgba(255,255,255,0.06);
    --border-accent: rgba(0,230,118,0.3);
    --live-color: #ff4757;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .light-theme {
    --bg-primary: #f0f4f8;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #eef2f8;
    --accent: #00875a;
    --accent-dim: #006644;
    --accent-glow: rgba(0,135,90,0.1);
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #a0aec0;
    --border: rgba(0,0,0,0.08);
    --border-accent: rgba(0,135,90,0.3);
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--accent);
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo span { color: var(--text-primary); }
  .nav-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-primary);
    border-radius: 8px;
    padding: 3px;
    flex-shrink: 0;
  }
  .nav-tab {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active {
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .date-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .date-btn:hover, .date-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 7px 12px 7px 34px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--border-accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
  }
  .theme-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--border-accent); color: var(--accent); }
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
  }
  .sidebar {
    position: sticky;
    top: 72px;
    height: fit-content;
  }
  .sidebar-section {
    margin-bottom: 8px;
  }
  .sidebar-group-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 10px 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .sidebar-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .sidebar-item.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .sidebar-flag {
    font-size: 18px;
    line-height: 1;
  }
  .sidebar-badge {
    margin-left: auto;
    background: var(--live-color);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .content { min-width: 0; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-color);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform: scale(1); }
    50% { opacity:0.4; transform: scale(0.7); }
  }
  .match-count {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .league-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .league-header:hover { background: rgba(255,255,255,0.04); }
  .league-flag { font-size: 18px; line-height: 1; }
  .league-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  .league-country {
    font-size: 11px;
    color: var(--text-muted);
  }
  .league-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .league-live-count {
    background: rgba(255,71,87,0.15);
    color: var(--live-color);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .chevron {
    color: var(--text-muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(180deg); }
  .match-row {
    display: grid;
    grid-template-columns: 60px 1fr 80px 1fr 60px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    gap: 8px;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: var(--bg-hover); }
  .match-row.live-match { background: rgba(255,71,87,0.04); }
  .match-row.live-match:hover { background: rgba(255,71,87,0.08); }
  .match-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
  }
  .match-time.live {
    color: var(--live-color);
    font-size: 12px;
  }
  .match-time .minute {
    display: block;
    font-size: 10px;
    font-weight: 500;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .team-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team-row.away { flex-direction: row-reverse; }
  .team-logo {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .team-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-row.away .team-name { text-align: right; }
  .score-box {
    text-align: center;
  }
  .score-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 2px;
  }
  .score-text.live { color: var(--accent); }
  .score-separator {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
    margin-top: 1px;
  }
  .match-status {
    text-align: center;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }
  .status-finished { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .status-live { background: rgba(255,71,87,0.2); color: var(--live-color); }
  .status-upcoming { background: rgba(0,230,118,0.1); color: var(--accent); }
  .status-ht { background: rgba(253,211,42,0.15); color: var(--yellow); }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }
  .standings-container { display: none; }
  .standings-container.active { display: block; }
  .matches-container { display: block; }
  .matches-container.hidden { display: none; }
  .group-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .group-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .group-btn:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .group-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .standings-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .standings-league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .standings-table thead tr {
    border-bottom: 1px solid var(--border);
  }
  .standings-table th {
    padding: 7px 10px;
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .standings-table th:nth-child(2) { text-align: left; }
  .standings-table td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table td:nth-child(2) { text-align: left; }
  .standings-table tbody tr:hover { background: var(--bg-hover); }
  .standings-table .rank {
    font-weight: 700;
    color: var(--text-muted);
    font-size: 12px;
    width: 28px;
  }
  .standings-table .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .standings-table .pts {
    font-weight: 700;
    color: var(--text-primary);
    font-size: 14px;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .rank-ucl { color: #3498db !important; font-weight: 700 !important; }
  .rank-uel { color: #e67e22 !important; font-weight: 700 !important; }
  .rank-uecl { color: #27ae60 !important; font-weight: 700 !important; }
  .rank-rel { color: var(--live-color) !important; font-weight: 700 !important; }
  .rank-bar {
    width: 3px;
    height: 20px;
    border-radius: 2px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .bar-ucl { background: #3498db; }
  .bar-uel { background: #e67e22; }
  .bar-uecl { background: #27ae60; }
  .bar-rel { background: var(--live-color); }
  .bar-none { background: transparent; }
  .form-dots { display: flex; gap: 3px; }
  .form-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-size: 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .form-w { background: var(--accent); color: #000; }
  .form-d { background: var(--text-muted); }
  .form-l { background: var(--live-color); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 680px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-close {
    margin-left: auto;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--live-color); border-color: var(--live-color); }
  .modal-score-header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .modal-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .modal-team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .modal-team-name.right { text-align: right; }
  .modal-score-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: 4px;
    min-width: 100px;
    text-align: center;
  }
  .modal-score-big.live { color: var(--accent); }
  .modal-status-row {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .modal-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .modal-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .modal-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .modal-content {
    overflow-y: auto;
    padding: 16px 20px;
    flex: 1;
  }
  .event-list { list-style: none; }
  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .event-item:last-child { border-bottom: none; }
  .event-min {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
  }
  .event-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .icon-goal { background: rgba(0,230,118,0.15); }
  .icon-yellow { background: rgba(253,211,42,0.15); }
  .icon-red { background: rgba(255,71,87,0.15); }
  .icon-sub { background: rgba(52,152,219,0.15); }
  .event-text { flex: 1; color: var(--text-primary); }
  .event-team { color: var(--text-muted); font-size: 11px; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-pill {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-pill:hover { border-color: var(--border-accent); }
  .filter-pill.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--live-color);
    background: rgba(255,71,87,0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,71,87,0.2);
    white-space: nowrap;
  }
  .loading-shimmer {
    background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-hover) 50%, var(--bg-card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
    height: 48px;
    margin-bottom: 2px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media(max-width:768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .header-inner { gap: 8px; }
    .nav-tabs { display: none; }
    .search-wrap { display: none; }
    .match-row { grid-template-columns: 50px 1fr 70px 1fr 50px; }
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">Goal<span>Zone</span></a>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchMainTab('matches', this)">Maçlar</button>
      <button class="nav-tab" onclick="switchMainTab('standings', this)">Puan Durumu</button>
    </div>
    <div class="date-nav">
      <button class="date-btn" id="btn-yesterday" onclick="selectDate(-1)">Dün</button>
      <button class="date-btn active" id="btn-today" onclick="selectDate(0)">Bugün</button>
      <button class="date-btn" id="btn-tomorrow" onclick="selectDate(1)">Yarın</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" placeholder="Takım veya lig ara..." id="searchInput" oninput="filterMatches(this.value)">
    </div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span id="liveCount">0 CANLI</span>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" title="Tema değiştir" id="themeBtn">🌙</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-group-title">Türkiye</div>
      <div class="sidebar-item active" onclick="filterLeague('all')">
        <span class="sidebar-flag">🏆</span>
        <span>Tüm Ligler</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Süper Lig')">
        <span class="sidebar-flag">🇹🇷</span>
        <span>Süper Lig</span>
        <span class="sidebar-badge" id="sb-sl"></span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('TFF 1. Lig')">
        <span class="sidebar-flag">🇹🇷</span>
        <span>TFF 1. Lig</span>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-group-title">Avrupa Top 5</div>
      <div class="sidebar-item" onclick="filterLeague('Premier League')">
        <span class="sidebar-flag">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>
        <span>Premier League</span>
        <span class="sidebar-badge" id="sb-pl"></span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('La Liga')">
        <span class="sidebar-flag">🇪🇸</span>
        <span>La Liga</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Bundesliga')">
        <span class="sidebar-flag">🇩🇪</span>
        <span>Bundesliga</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Serie A')">
        <span class="sidebar-flag">🇮🇹</span>
        <span>Serie A</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Ligue 1')">
        <span class="sidebar-flag">🇫🇷</span>
        <span>Ligue 1</span>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-group-title">Avrupa Kupaları</div>
      <div class="sidebar-item" onclick="filterLeague('Şampiyonlar Ligi')">
        <span class="sidebar-flag">⭐</span>
        <span>Şampiyonlar Ligi</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('UEFA Avrupa Ligi')">
        <span class="sidebar-flag">🌟</span>
        <span>Avrupa Ligi</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('UECL')">
        <span class="sidebar-flag">✨</span>
        <span>Konferans Ligi</span>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-group-title">Diğer</div>
      <div class="sidebar-item" onclick="filterLeague('Eredivisie')">
        <span class="sidebar-flag">🇳🇱</span>
        <span>Eredivisie</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Primeira Liga')">
        <span class="sidebar-flag">🇵🇹</span>
        <span>Primeira Liga</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('MLS')">
        <span class="sidebar-flag">🇺🇸</span>
        <span>MLS</span>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="matches-container" id="matchesContainer">
      <div class="filter-row">
        <button class="filter-pill active" onclick="setFilter('all',this)">Tümü</button>
        <button class="filter-pill" onclick="setFilter('live',this)">🔴 Canlı</button>
        <button class="filter-pill" onclick="setFilter('finished',this)">✅ Bitti</button>
        <button class="filter-pill" onclick="setFilter('upcoming',this)">🕐 Yaklaşan</button>
      </div>
      <div id="matchesContent"></div>
    </div>

    <div class="standings-container" id="standingsContainer">
      <div class="group-selector" id="standingsGroupSelector">
        <button class="group-btn active" onclick="selectStandingsGroup('turkey',this)">🇹🇷 Türkiye</button>
        <button class="group-btn" onclick="selectStandingsGroup('england',this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 İngiltere</button>
        <button class="group-btn" onclick="selectStandingsGroup('spain',this)">🇪🇸 İspanya</button>
        <button class="group-btn" onclick="selectStandingsGroup('germany',this)">🇩🇪 Almanya</button>
        <button class="group-btn" onclick="selectStandingsGroup('italy',this)">🇮🇹 İtalya</button>
        <button class="group-btn" onclick="selectStandingsGroup('france',this)">🇫🇷 Fransa</button>
        <button class="group-btn" onclick="selectStandingsGroup('europe',this)">⭐ Avrupa</button>
        <button class="group-btn" onclick="selectStandingsGroup('other',this)">🌍 Diğer</button>
      </div>
      <div id="standingsContent"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="matchModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span id="modalLeagueName" style="font-size:13px;color:var(--text-muted);font-weight:500;"></span>
      <span id="modalDate" style="font-size:12px;color:var(--text-muted);margin-left:auto;"></span>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-score-header">
      <div class="modal-teams">
        <div class="modal-team-name" id="modalHome"></div>
        <div class="modal-score-big" id="modalScore"></div>
        <div class="modal-team-name right" id="modalAway"></div>
      </div>
      <div class="modal-status-row" id="modalStatusRow"></div>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchModalTab('events',this)">Olaylar</button>
      <button class="modal-tab" onclick="switchModalTab('lineup',this)">Kadro</button>
      <button class="modal-tab" onclick="switchModalTab('stats',this)">İstatistik</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
