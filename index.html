<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaçAydın - Canlı Futbol Skorları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: #161d2e;
    --bg-hover: #1e2840;
    --accent: #00e676;
    --accent-dim: #00c864;
    --accent-glow: rgba(0,230,118,0.15);
    --red: #ff4757;
    --yellow: #ffd32a;
    --blue: #3498db;
    --text-primary: #f0f4ff;
    --text-secondary: #8892aa;
    --text-muted: #4a5568;
    --border: rgba(255,255,255,0.06);
    --border-accent: rgba(0,230,118,0.3);
    --live-color: #ff4757;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .light-theme {
    --bg-primary: #f0f4f8;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #eef2f8;
    --accent: #00875a;
    --accent-dim: #006644;
    --accent-glow: rgba(0,135,90,0.1);
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #a0aec0;
    --border: rgba(0,0,0,0.08);
    --border-accent: rgba(0,135,90,0.3);
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--accent);
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo span { color: var(--text-primary); }
  .nav-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-primary);
    border-radius: 8px;
    padding: 3px;
    flex-shrink: 0;
  }
  .nav-tab {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active {
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .date-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .date-btn:hover, .date-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 7px 12px 7px 34px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--border-accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
  }
  .theme-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--border-accent); color: var(--accent); }
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
  }
  .sidebar {
    position: sticky;
    top: 72px;
    height: fit-content;
  }
  .sidebar-section {
    margin-bottom: 8px;
  }
  .sidebar-group-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 10px 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .sidebar-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .sidebar-item.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .sidebar-flag {
    font-size: 18px;
    line-height: 1;
  }
  .sidebar-badge {
    margin-left: auto;
    background: var(--live-color);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .content { min-width: 0; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-color);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform: scale(1); }
    50% { opacity:0.4; transform: scale(0.7); }
  }
  .match-count {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .league-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .league-header:hover { background: rgba(255,255,255,0.04); }
  .league-flag { font-size: 18px; line-height: 1; }
  .league-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  .league-country {
    font-size: 11px;
    color: var(--text-muted);
  }
  .league-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .league-live-count {
    background: rgba(255,71,87,0.15);
    color: var(--live-color);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .chevron {
    color: var(--text-muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(180deg); }
  .match-row {
    display: grid;
    grid-template-columns: 60px 1fr 80px 1fr 60px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    gap: 8px;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: var(--bg-hover); }
  .match-row.live-match { background: rgba(255,71,87,0.04); }
  .match-row.live-match:hover { background: rgba(255,71,87,0.08); }
  .match-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
  }
  .match-time.live {
    color: var(--live-color);
    font-size: 12px;
  }
  .match-time .minute {
    display: block;
    font-size: 10px;
    font-weight: 500;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .team-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team-row.away { flex-direction: row-reverse; }
  .team-logo {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .team-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-row.away .team-name { text-align: right; }
  .score-box {
    text-align: center;
  }
  .score-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 2px;
  }
  .score-text.live { color: var(--accent); }
  .score-separator {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
    margin-top: 1px;
  }
  .match-status {
    text-align: center;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }
  .status-finished { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .status-live { background: rgba(255,71,87,0.2); color: var(--live-color); }
  .status-upcoming { background: rgba(0,230,118,0.1); color: var(--accent); }
  .status-ht { background: rgba(253,211,42,0.15); color: var(--yellow); }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }
  .standings-container { display: none; }
  .standings-container.active { display: block; }
  .matches-container { display: block; }
  .matches-container.hidden { display: none; }
  .group-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .group-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .group-btn:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .group-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .standings-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .standings-league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .standings-table thead tr {
    border-bottom: 1px solid var(--border);
  }
  .standings-table th {
    padding: 7px 10px;
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .standings-table th:nth-child(2) { text-align: left; }
  .standings-table td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table td:nth-child(2) { text-align: left; }
  .standings-table tbody tr:hover { background: var(--bg-hover); }
  .standings-table .rank {
    font-weight: 700;
    color: var(--text-muted);
    font-size: 12px;
    width: 28px;
  }
  .standings-table .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .standings-table .pts {
    font-weight: 700;
    color: var(--text-primary);
    font-size: 14px;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .rank-ucl { color: #3498db !important; font-weight: 700 !important; }
  .rank-uel { color: #e67e22 !important; font-weight: 700 !important; }
  .rank-uecl { color: #27ae60 !important; font-weight: 700 !important; }
  .rank-rel { color: var(--live-color) !important; font-weight: 700 !important; }
  .rank-bar {
    width: 3px;
    height: 20px;
    border-radius: 2px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .bar-ucl { background: #3498db; }
  .bar-uel { background: #e67e22; }
  .bar-uecl { background: #27ae60; }
  .bar-rel { background: var(--live-color); }
  .bar-none { background: transparent; }
  .form-dots { display: flex; gap: 3px; }
  .form-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-size: 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .form-w { background: var(--accent); color: #000; }
  .form-d { background: var(--text-muted); }
  .form-l { background: var(--live-color); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 680px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-close {
    margin-left: auto;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--live-color); border-color: var(--live-color); }
  .modal-score-header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .modal-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .modal-team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .modal-team-name.right { text-align: right; }
  .modal-score-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: 4px;
    min-width: 100px;
    text-align: center;
  }
  .modal-score-big.live { color: var(--accent); }
  .modal-status-row {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .modal-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .modal-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .modal-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .modal-content {
    overflow-y: auto;
    padding: 16px 20px;
    flex: 1;
  }
  .event-list { list-style: none; }
  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .event-item:last-child { border-bottom: none; }
  .event-min {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
  }
  .event-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .icon-goal { background: rgba(0,230,118,0.15); }
  .icon-yellow { background: rgba(253,211,42,0.15); }
  .icon-red { background: rgba(255,71,87,0.15); }
  .icon-sub { background: rgba(52,152,219,0.15); }
  .event-text { flex: 1; color: var(--text-primary); }
  .event-team { color: var(--text-muted); font-size: 11px; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-pill {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-pill:hover { border-color: var(--border-accent); }
  .filter-pill.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--live-color);
    background: rgba(255,71,87,0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,71,87,0.2);
    white-space: nowrap;
  }
  .loading-shimmer {
    background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-hover) 50%, var(--bg-card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
    height: 48px;
    margin-bottom: 2px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media(max-width:768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .header-inner { gap: 8px; }
    .nav-tabs { display: none; }
    .search-wrap { display: none; }
    .match-row { grid-template-columns: 50px 1fr 70px 1fr 50px; }
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">Maç<span>Aydın</span></a>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchMainTab('matches', this)">Maçlar</button>
      <button class="nav-tab" onclick="switchMainTab('standings', this)">Puan Durumu</button>
    </div>
    <div class="date-nav">
      <button class="date-btn" id="btn-yesterday" onclick="selectDate(-1)">Dün</button>
      <button class="date-btn active" id="btn-today" onclick="selectDate(0)">Bugün</button>
      <button class="date-btn" id="btn-tomorrow" onclick="selectDate(1)">Yarın</button>
    </div>

      <div class="sidebar-item" onclick="filterLeague('Bundesliga')">
        <span class="sidebar-flag">🇩🇪</span>
        <span>Bundesliga</span>
      </div>
      <div class="sidebar-item" onclick="filterLeague('Serie A')">
        <span class="sidebar-flag">🇮🇹</span>

        <button class="group-btn" onclick="selectStandingsGroup('spain',this)">🇪🇸 İspanya</button>

      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-score-header">
      <div class="modal-teams">
        <div class="modal-team-name" id="modalHome"></div>
        <div class="modal-score-big" id="modalScore"></div>
        <div class="modal-team-name right" id="modalAway"></div>
      </div>
      <div class="modal-status-row" id="modalStatusRow"></div>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchModalTab('events',this)">Olaylar</button>
      <button class="modal-tab" onclick="switchModalTab('lineup',this)">Kadro</button>
      <button class="modal-tab" onclick="switchModalTab('stats',this)">İstatistik</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>

<script>
// ============================================================
// GLOBAL STATE
// ============================================================
let currentDate = 0;
let currentFilter = 'all';
let currentLeagueFilter = 'all';
let currentSearchQuery = '';
let currentModalMatch = null;
let currentModalTab = 'events';
let isLightTheme = false;
let currentStandingsGroup = 'turkey';
let matchData = [];
let filteredMatches = [];

const LEAGUES = {
  'Süper Lig':       { flag:'🇹🇷', country:'Türkiye', group:'turkey', code: 'TB1' },
  'TFF 1. Lig':      { flag:'🇹🇷', country:'Türkiye', group:'turkey', code: 'TB2' },
  'Premier League':  { flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', country:'İngiltere', group:'england', code: 'PL' },
  'La Liga':         { flag:'🇪🇸', country:'İspanya', group:'spain', code: 'LA' },
  'Bundesliga':      { flag:'🇩🇪', country:'Almanya', group:'germany', code: 'BL1' },
  'Serie A':         { flag:'🇮🇹', country:'İtalya', group:'italy', code: 'SA' },
  'Ligue 1':         { flag:'🇫🇷', country:'Fransa', group:'france', code: 'FL1' },
  'Şampiyonlar Ligi':{ flag:'⭐', country:'UEFA', group:'europe', code: 'CL' },
  'UEFA Avrupa Ligi':{ flag:'🌟', country:'UEFA', group:'europe', code: 'EL' },
  'UECL':            { flag:'✨', country:'UEFA', group:'europe', code: 'UECL' },
  'Eredivisie':      { flag:'🇳🇱', country:'Hollanda', group:'other', code: 'DED' },
  'Primeira Liga':   { flag:'🇵🇹', country:'Portekiz', group:'other', code: 'PPL' },
  'MLS':             { flag:'🇺🇸', country:'Amerika', group:'other', code: 'MLS' },
};

// ============================================================
// API CONFIGURATION - FOOTBALL-DATA.ORG
// ============================================================
const API_CONFIG = {
  baseUrl: 'https://api.football-data.org/v4',
  // Ücretsiz API key - football-data.org'dan kendi keyi ile değiştirin
  // https://www.football-data.org/
  key: 'a2ee35f8-3d0f-4a92-b8d6-e7e0c58b57c8',
};

// ============================================================
// HELPER FUNCTIONS
// ============================================================
function getDateStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}

function getDateLabel() {
  const now = new Date();
  const d = new Date(now.getTime() + currentDate * 86400000);
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
}

function mapStatus(status, utcDate) {
  if (!status) return 'upcoming';
  const s = status.toLowerCase();
  if (s.includes('finished') || s.includes('completed')) return 'finished';
  if (s.includes('halftime')) return 'ht';
  if (s.includes('in_play') || s.includes('live')) return 'live';
  return 'upcoming';
}

// ============================================================
// API FUNCTIONS - FOOTBALL-DATA.ORG
// ============================================================
async function fetchFromAPI(dateStr) {
  try {
    const response = await fetch(
      `${API_CONFIG.baseUrl}/matches?dateFrom=${dateStr}&dateTo=${dateStr}`,
      {
        headers: { 'X-Auth-Token': API_CONFIG.key }
      }
    );
    
    if (!response.ok) {
      console.warn('API error:', response.status);
      return null;
    }
    
    const data = await response.json();
    
    if (!data.matches || data.matches.length === 0) {
      return null;
    }
    
    return data.matches.map(m => {
      const leagueName = m.competition.name;
      const status = mapStatus(m.status, m.utcDate);
      let minute = null;
      
      if (m.score && m.score.duration === 'LIVE' && m.score.fullTime.home === null) {
        const startTime = new Date(m.utcDate);
        const nowTime = new Date();
        minute = Math.floor((nowTime - startTime) / 60000);
      }
      
      const time = new Date(m.utcDate).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      
      return {
        id: m.id,
        league: leagueName,
        homeTeam: m.homeTeam.name,
        homeCode: m.homeTeam.tla || m.homeTeam.name.substring(0, 3),
        awayTeam: m.awayTeam.name,
        awayCode: m.awayTeam.tla || m.awayTeam.name.substring(0, 3),
        homeScore: m.score.fullTime.home,
        awayScore: m.score.fullTime.away,
        status: status,
        time: time,
        minute: minute,
        utcDate: m.utcDate,
      };
    });
  } catch (error) {
    console.error('API error:', error);
    return null;
  }
}

// ============================================================
// UI RENDER FUNCTIONS
// ============================================================
async function loadMatches() {
  const dateStr = getDateStr(currentDate);
  const matches = await fetchFromAPI(dateStr);
  
  if (matches) {
    matchData = matches;
  } else {
    matchData = [];
  }
  
  applyFilters();
  renderMatches();
}

function applyFilters() {
  filteredMatches = matchData.filter(match => {
    // League filter
    if (currentLeagueFilter !== 'all' && match.league !== currentLeagueFilter) {
      return false;
    }
    
    // Status filter
    if (currentFilter !== 'all' && match.status !== currentFilter) {
      return false;
    }
    
    // Search filter
    if (currentSearchQuery) {
      const query = currentSearchQuery.toLowerCase();
      if (!match.homeTeam.toLowerCase().includes(query) && 
          !match.awayTeam.toLowerCase().includes(query) &&
          !match.league.toLowerCase().includes(query)) {
        return false;
      }
    }
    
    return true;
  });
}

function renderMatches() {
  const container = document.getElementById('matchesContent');
  
  if (filteredMatches.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚽</div>
        <p>Bu tarihte maç bulunamadı</p>
      </div>
    `;
    return;
  }
  
  // Group by league
  const grouped = {};
  filteredMatches.forEach(match => {
    if (!grouped[match.league]) {
      grouped[match.league] = [];
    }
    grouped[match.league].push(match);
  });
  
  let html = '';
  for (const league in grouped) {
    const league_info = LEAGUES[league] || { flag: '🏆', country: 'Bilinmeyen' };
    const matches = grouped[league];
    const liveCount = matches.filter(m => m.status === 'live').length;
    
    html += `
      <div class="league-block">
        <div class="league-header" onclick="toggleLeague(this)">
          <span class="league-flag">${league_info.flag}</span>
          <div>
            <div class="league-name">${league}</div>
            <div class="league-country">${league_info.country}</div>
          </div>
          <div class="league-meta">
            ${liveCount > 0 ? `<span class="league-live-count">${liveCount} CANLI</span>` : ''}
            <span class="chevron open">▼</span>
          </div>
        </div>
    `;
    
    matches.forEach(match => {
      const statusClass = `status-${match.status}`;
      const statusText = match.status === 'live' ? '🔴 CANLI' : 
                        match.status === 'finished' ? '✅ BİTTİ' :
                        match.status === 'ht' ? '⏸ YARIYOL' : '🕐 YAKLAŞAN';
      
      const homeScore = match.homeScore !== null ? match.homeScore : '-';
      const awayScore = match.awayScore !== null ? match.awayScore : '-';
      
      html += `
        <div class="match-row ${match.status === 'live' ? 'live-match' : ''}" onclick="openMatchModal(${match.id})">
          <div class="match-time ${match.status === 'live' ? 'live' : ''}">
            ${match.status === 'live' ? `<span class="minute">${match.minute || 0}'</span>` : match.time}
          </div>
          <div class="team-row">
            <div class="team-logo">${match.homeCode}</div>
            <div class="team-name">${match.homeTeam}</div>
          </div>
          <div class="score-box">
            <div class="score-text ${match.status === 'live' ? 'live' : ''}">${homeScore} - ${awayScore}</div>
          </div>
          <div class="team-row away">
            <div class="team-logo">${match.awayCode}</div>
            <div class="team-name">${match.awayTeam}</div>
          </div>
          <div class="match-status">
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
        </div>
      `;
    });
    
    html += `</div>`;
  }
  
  container.innerHTML = html;
  updateLiveCount();
}

function updateLiveCount() {
  const liveCount = matchData.filter(m => m.status === 'live').length;
  document.getElementById('liveCount').textContent = `${liveCount} CANLI`;
}

// ============================================================
// UI INTERACTION FUNCTIONS
// ============================================================
function switchMainTab(tabName, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  
  const matchesContainer = document.getElementById('matchesContainer');
  const standingsContainer = document.getElementById('standingsContainer');
  
  if (tabName === 'matches') {
    matchesContainer.classList.remove('hidden');
    standingsContainer.classList.remove('active');
  } else {
    matchesContainer.classList.add('hidden');
    standingsContainer.classList.add('active');
  }
}

function selectDate(offset) {
  currentDate = offset;
  document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
  if (offset === -1) {
    document.getElementById('btn-yesterday').classList.add('active');
  } else if (offset === 0) {
    document.getElementById('btn-today').classList.add('active');
  } else {
    document.getElementById('btn-tomorrow').classList.add('active');
  }
  loadMatches();
}

function filterLeague(league) {
  currentLeagueFilter = league;
  document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
  event.currentTarget.classList.add('active');
  applyFilters();
  renderMatches();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
  renderMatches();
}

function filterMatches(query) {
  currentSearchQuery = query;
  applyFilters();
  renderMatches();
}

function toggleTheme() {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle('light-theme', isLightTheme);
  document.getElementById('themeBtn').textContent = isLightTheme ? '☀️' : '🌙';
}

function toggleLeague(header) {
  const block = header.parentElement;
  const rows = block.querySelectorAll('.match-row');
  const chevron = header.querySelector('.chevron');
  
  rows.forEach(row => {
    row.style.display = row.style.display === 'none' ? '' : 'none';
  });
  
  chevron.classList.toggle('open');
}

// ============================================================
// MODAL FUNCTIONS
// ============================================================
function openMatchModal(matchId) {
  const match = matchData.find(m => m.id === matchId);
  if (!match) return;
  
  currentModalMatch = match;
  document.getElementById('modalLeagueName').textContent = match.league;
  document.getElementById('modalHome').textContent = match.homeTeam;
  document.getElementById('modalAway').textContent = match.awayTeam;
  
  const homeScore = match.homeScore !== null ? match.homeScore : '?';
  const awayScore = match.awayScore !== null ? match.awayScore : '?';
  document.getElementById('modalScore').textContent = `${homeScore} - ${awayScore}`;
  
  if (match.status === 'live') {
    document.getElementById('modalScore').classList.add('live');
    document.getElementById('modalStatusRow').textContent = `🔴 ${match.minute}. dakika`;
  } else {
    document.getElementById('modalScore').classList.remove('live');
    const statusText = match.status === 'finished' ? 'Maç bitti' :
                      match.status === 'ht' ? 'Yarıyol' : 'Yaklaşan';
    document.getElementById('modalStatusRow').textContent = statusText;
  }
  
  currentModalTab = 'events';
  renderModalContent();
  
  document.getElementById('matchModal').classList.add('open');
}

function closeModalBtn() {
  document.getElementById('matchModal').classList.remove('open');
}

function closeModal(event) {
  if (event.target.id === 'matchModal') {
    closeModalBtn();
  }
}

function switchModalTab(tabName, btn) {
  currentModalTab = tabName;
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderModalContent();
}

function renderModalContent() {
  const container = document.getElementById('modalContent');
  
  if (currentModalTab === 'events') {
    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Maç etkinlikleri yakında eklenecek</p>';
  } else if (currentModalTab === 'lineup') {
    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Kadro bilgileri yakında eklenecek</p>';
  } else if (currentModalTab === 'stats') {
    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">İstatistikler yakında eklenecek</p>';
  }
}

function selectStandingsGroup(group, btn) {
  currentStandingsGroup = group;
  document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Standings rendering coming soon
}

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  selectDate(0);
});
</script>

</body>
</html>
