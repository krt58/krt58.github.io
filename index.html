<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaçAydın - Canlı Futbol Skorları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: #161d2e;
    --bg-hover: #1e2840;
    --accent: #00e676;
    --accent-dim: #00c864;
    --accent-glow: rgba(0,230,118,0.15);
    --red: #ff4757;
    --yellow: #ffd32a;
    --blue: #3498db;
    --text-primary: #f0f4ff;
    --text-secondary: #8892aa;
    --text-muted: #4a5568;
    --border: rgba(255,255,255,0.06);
    --border-accent: rgba(0,230,118,0.3);
    --live-color: #ff4757;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .light-theme {
    --bg-primary: #f0f4f8;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #eef2f8;
    --accent: #00875a;
    --accent-dim: #006644;
    --accent-glow: rgba(0,135,90,0.1);
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #a0aec0;
    --border: rgba(0,0,0,0.08);
    --border-accent: rgba(0,135,90,0.3);
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--accent);
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo span { color: var(--text-primary); }
  .nav-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-primary);
    border-radius: 8px;
    padding: 3px;
    flex-shrink: 0;
  }
  .nav-tab {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active {
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .date-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .date-btn:hover, .date-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 7px 12px 7px 34px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--border-accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
  }
  .theme-btn {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--border-accent); color: var(--accent); }
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
  }
  .sidebar {
    position: sticky;
    top: 72px;
    height: fit-content;
  }
  .sidebar-section {
    margin-bottom: 8px;
  }
  .sidebar-group-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 10px 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .sidebar-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .sidebar-item.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .sidebar-flag {
    font-size: 18px;
    line-height: 1;
  }
  .sidebar-badge {
    margin-left: auto;
    background: var(--live-color);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .content { min-width: 0; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-color);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform: scale(1); }
    50% { opacity:0.4; transform: scale(0.7); }
  }
  .match-count {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .league-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .league-header:hover { background: rgba(255,255,255,0.04); }
  .league-flag { font-size: 18px; line-height: 1; }
  .league-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  .league-country {
    font-size: 11px;
    color: var(--text-muted);
  }
  .league-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .league-live-count {
    background: rgba(255,71,87,0.15);
    color: var(--live-color);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .chevron {
    color: var(--text-muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(180deg); }
  .match-row {
    display: grid;
    grid-template-columns: 60px 1fr 80px 1fr 60px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    gap: 8px;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: var(--bg-hover); }
  .match-row.live-match { background: rgba(255,71,87,0.04); }
  .match-row.live-match:hover { background: rgba(255,71,87,0.08); }
  .match-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
  }
  .match-time.live {
    color: var(--live-color);
    font-size: 12px;
  }
  .match-time .minute {
    display: block;
    font-size: 10px;
    font-weight: 500;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .team-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team-row.away { flex-direction: row-reverse; }
  .team-logo {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .team-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-row.away .team-name { text-align: right; }
  .score-box {
    text-align: center;
  }
  .score-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 2px;
  }
  .score-text.live { color: var(--accent); }
  .score-separator {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
    margin-top: 1px;
  }
  .match-status {
    text-align: center;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }
  .status-finished { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .status-live { background: rgba(255,71,87,0.2); color: var(--live-color); }
  .status-upcoming { background: rgba(0,230,118,0.1); color: var(--accent); }
  .status-ht { background: rgba(253,211,42,0.15); color: var(--yellow); }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }
  .standings-container { display: none; }
  .standings-container.active { display: block; }
  .matches-container { display: block; }
  .matches-container.hidden { display: none; }
  .group-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .group-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .group-btn:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .group-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .standings-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .standings-league-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .standings-table thead tr {
    border-bottom: 1px solid var(--border);
  }
  .standings-table th {
    padding: 7px 10px;
    text-align: center;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .standings-table th:nth-child(2) { text-align: left; }
  .standings-table td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table td:nth-child(2) { text-align: left; }
  .standings-table tbody tr:hover { background: var(--bg-hover); }
  .standings-table .rank {
    font-weight: 700;
    color: var(--text-muted);
    font-size: 12px;
    width: 28px;
  }
  .standings-table .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .standings-table .pts {
    font-weight: 700;
    color: var(--text-primary);
    font-size: 14px;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .rank-ucl { color: #3498db !important; font-weight: 700 !important; }
  .rank-uel { color: #e67e22 !important; font-weight: 700 !important; }
  .rank-uecl { color: #27ae60 !important; font-weight: 700 !important; }
  .rank-rel { color: var(--live-color) !important; font-weight: 700 !important; }
  .rank-bar {
    width: 3px;
    height: 20px;
    border-radius: 2px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .bar-ucl { background: #3498db; }
  .bar-uel { background: #e67e22; }
  .bar-uecl { background: #27ae60; }
  .bar-rel { background: var(--live-color); }
  .bar-none { background: transparent; }
  .form-dots { display: flex; gap: 3px; }
  .form-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    font-size: 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .form-w { background: var(--accent); color: #000; }
  .form-d { background: var(--text-muted); }
  .form-l { background: var(--live-color); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 680px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-close {
    margin-left: auto;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--live-color); border-color: var(--live-color); }
  .modal-score-header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .modal-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .modal-team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .modal-team-name.right { text-align: right; }
  .modal-score-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: 4px;
    min-width: 100px;
    text-align: center;
  }
  .modal-score-big.live { color: var(--accent); }
  .modal-status-row {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .modal-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .modal-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .modal-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .modal-content {
    overflow-y: auto;
    padding: 16px 20px;
    flex: 1;
  }
  .event-list { list-style: none; }
  .event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .event-item:last-child { border-bottom: none; }
  .event-min {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
  }
  .event-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .icon-goal { background: rgba(0,230,118,0.15); }
  .icon-yellow { background: rgba(253,211,42,0.15); }
  .icon-red { background: rgba(255,71,87,0.15); }
  .icon-sub { background: rgba(52,152,219,0.15); }
  .event-text { flex: 1; color: var(--text-primary); }
  .event-team { color: var(--text-muted); font-size: 11px; }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-pill {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-pill:hover { border-color: var(--border-accent); }
  .filter-pill.active {
    background: var(--accent-glow);
    border-color: var(--border-accent);
    color: var(--accent);
  }
  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--live-color);
    background: rgba(255,71,87,0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,71,87,0.2);
    white-space: nowrap;
  }
  .loading-shimmer {
    background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-hover) 50%, var(--bg-card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
    height: 48px;
    margin-bottom: 2px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media(max-width:768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .header-inner { gap: 8px; }
    .nav-tabs { display: none; }
    .search-wrap { display: none; }
    .match-row { grid-template-columns: 50px 1fr 70px 1fr 50px; }
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">Maç<span>Aydın</span></a>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchMainTab('matches', this)">Maçlar</button>
      <button class="nav-tab" onclick="switchMainTab('standings', this)">Puan Durumu</button>
    </div>
    <div class="date-nav">
      <button class="date-btn" id="btn-yesterday" onclick="selectDate(-1)">Dün</button>
      <button class="date-btn active" id="btn-today" onclick="selectDate(0)">Bugün</button>
      <button class="date-btn" id="btn-tomorrow" onclick="selectDate(1)">Yarın</button>
    </div>

<script>
// ============================================================
// GLOBAL STATE
// ============================================================
let currentDate = 0;
let currentFilter = 'all';
let currentLeagueFilter = 'all';
let currentSearchQuery = '';
let currentModalMatch = null;
let currentModalTab = 'events';
let isLightTheme = false;
let currentStandingsGroup = 'turkey';
let matchData = [];
let filteredMatches = [];

const LEAGUES = {
  'Süper Lig':       { flag:'🇹🇷', country:'Türkiye', group:'turkey', code: 'TB1' },
  'TFF 1. Lig':      { flag:'🇹🇷', country:'Türkiye', group:'turkey', code: 'TB2' },
  'Premier League':  { flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', country:'İngiltere', group:'england', code: 'PL' },
  'La Liga':         { flag:'🇪🇸', country:'İspanya', group:'spain', code: 'LA' },
  'Bundesliga':      { flag:'🇩🇪', country:'Almanya', group:'germany', code: 'BL1' },
  'Serie A':         { flag:'🇮🇹', country:'İtalya', group:'italy', code: 'SA' },
  'Ligue 1':         { flag:'🇫🇷', country:'Fransa', group:'france', code: 'FL1' },
  'Şampiyonlar Ligi':{ flag:'⭐', country:'UEFA', group:'europe', code: 'CL' },
  'UEFA Avrupa Ligi':{ flag:'🌟', country:'UEFA', group:'europe', code: 'EL' },
  'UECL':            { flag:'✨', country:'UEFA', group:'europe', code: 'UECL' },
  'Eredivisie':      { flag:'🇳🇱', country:'Hollanda', group:'other', code: 'DED' },
  'Primeira Liga':   { flag:'🇵🇹', country:'Portekiz', group:'other', code: 'PPL' },
  'MLS':             { flag:'🇺🇸', country:'Amerika', group:'other', code: 'MLS' },
};

// ============================================================
// API CONFIGURATION - FOOTBALL-DATA.ORG
// ============================================================
const API_CONFIG = {
  baseUrl: 'https://api.football-data.org/v4',
  // Ücretsiz API key - football-data.org'dan kendi keyi ile değiştirin
  // https://www.football-data.org/
  key: 'a2ee35f8-3d0f-4a92-b8d6-e7e0c58b57c8',
};

// ============================================================
// HELPER FUNCTIONS
// ============================================================
function getDateStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}

function getDateLabel() {
  const now = new Date();
  const d = new Date(now.getTime() + currentDate * 86400000);
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
}

function mapStatus(status, utcDate) {
  if (!status) return 'upcoming';
  const s = status.toLowerCase();
  if (s.includes('finished') || s.includes('completed')) return 'finished';
  if (s.includes('halftime')) return 'ht';
  if (s.includes('in_play') || s.includes('live')) return 'live';
  return 'upcoming';
}

// ============================================================
// API FUNCTIONS - FOOTBALL-DATA.ORG
// ============================================================
async function fetchFromAPI(dateStr) {
  try {
    const response = await fetch(
      `${API_CONFIG.baseUrl}/matches?dateFrom=${dateStr}&dateTo=${dateStr}`,
      {
        headers: { 'X-Auth-Token': API_CONFIG.key }
      }
    );
    
    if (!response.ok) {
      console.warn('API error:', response.status);
      return null;
    }
    
    const data = await response.json();
    
    if (!data.matches || data.matches.length === 0) {
      return null;
    }
    
    return data.matches.map(m => {
      const leagueName = m.competition.name;
      const status = mapStatus(m.status, m.utcDate);
      let minute = null;
      
      if (m.score && m.score.duration === 'LIVE' && m.score.fullTime.home === null) {
        const startTime = new Date(m.utcDate);
        const nowTime = new Date();
        minute = Math.floor((nowTime - startTime) / 60000);
      }
      
      const time = new Date(m.utcDate).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      
      return {
        id: m.id,
        league: leagueName,
        homeTeam: m.homeTeam.name,
        homeCode: m.homeTeam.tla || m.homeTeam.name.substring(0, 3),
        awayTeam: m.awayTeam.name,
        awayCode: m.awayTeam.tla || m.awayTeam.name.substring(0, 3),
        homeScore: m.score.fullTime.home,
        awayScore: m.score.fullTime.away,
        status: status,
        time: time,
        minute: minute,
        source: 'api'
      };
    });
  } catch (e) {
    console.warn('API fetch failed:', e.message);
    return null;
  }
}

// ============================================================
// FALLBACK DATA GENERATOR
// ============================================================
function generateFallbackMatches(dateOffset) {
  const seed = dateOffset + 100;
  const rng = (n, max, min=0) => ((seed * 9301 + n * 49297 + 233) % 1000 / 1000 * (max - min) + min) | 0;

  let id = 1;
  const matches = [];
  const leagueConfigs = [
    { league:'Süper Lig', teams:[
        ['Galatasaray','GS'],['Fenerbahçe','FB'],['Beşiktaş','BJK'],['Trabzonspor','TS'],
        ['Başakşehir','İBB'],['Sivasspor','SİV'],['Konyaspor','KON'],['Kasımpaşa','KAŞ'],
      ], count: 3
    },
    { league:'Premier League', teams:[
        ['Man City','MCI'],['Arsenal','ARS'],['Liverpool','LIV'],['Chelsea','CHE'],
        ['Aston Villa','AVL'],['Newcastle','NEW'],['Man United','MUN'],['Spurs','TOT'],
      ], count: 4
    },
    { league:'La Liga', teams:[
        ['Real Madrid','RMA'],['Barcelona','BAR'],['Atletico Madrid','ATM'],['Sevilla','SEV'],
        ['Real Sociedad','RSO'],['Villarreal','VIL'],['Athletic Club','ATH'],['Valencia','VAL'],
      ], count: 3
    },
    { league:'Bundesliga', teams:[
        ['Bayern Münih','FCB'],['Borussia Dortmund','BVB'],['Leverkusen','B04'],['Leipzig','RBL'],
        ['Eintracht','SGE'],['Wolfsburg','WOB'],['Freiburg','SCF'],['Köln','KOE'],
      ], count: 3
    },
    { league:'Serie A', teams:[
        ['Inter Milan','INT'],['AC Milan','MIL'],['Juventus','JUV'],['Napoli','NAP'],
        ['Roma','ROM'],['Lazio','LAZ'],['Fiorentina','FIO'],['Atalanta','ATA'],
      ], count: 3
    },
    { league:'Ligue 1', teams:[
        ['PSG','PSG'],['Monaco','MON'],['Nice','OGC'],['Lens','LEN'],
        ['Lyon','OLY'],['Marseille','OM'],['Lille','LIL'],['Rennes','REN'],
      ], count: 3
    },
  ];

  const statusPool = dateOffset === 0 
    ? ['live','live','live','finished','finished','finished','finished','upcoming','upcoming','upcoming']
    : dateOffset === -1 
    ? ['finished','finished','finished','finished','finished','finished']
    : ['upcoming','upcoming','upcoming','upcoming'];

  const times_upcoming = ['18:00','18:30','19:00','19:45','20:00','20:30','21:00','21:45'];
  const times_finished = ['14:00','15:00','16:00','16:30','17:00','17:30'];
  const minutes_live = [12,23,34,45,56,67,78,88];

  leagueConfigs.forEach((cfg, li) => {
    for (let m = 0; m < cfg.count; m++) {
      const hi = rng(id * 7 + li * 3, cfg.teams.length);
      const ai = rng(id * 13 + li * 5 + m * 7, cfg.teams.length);
      if (hi === ai) continue;

      const statusIdx = rng(id * 17 + m, statusPool.length);
      const status = statusPool[statusIdx % statusPool.length];

      let homeScore = null, awayScore = null, minute = null, time = '';

      if (status === 'live') {
        homeScore = rng(id * 11, 4);
        awayScore = rng(id * 19, 4);
        minute = minutes_live[rng(id * 3, minutes_live.length)];
        time = minute + "'" 
      } else if (status === 'finished') {
        homeScore = rng(id * 7, 5);
        awayScore = rng(id * 23, 5);
        time = times_finished[rng(id, times_finished.length)];
      } else {
        time = times_upcoming[rng(id * 5, times_upcoming.length)];
      }

      matches.push({
        id: `fallback_${id}`,
        league: cfg.league,
        homeTeam: cfg.teams[hi][0],
        homeCode: cfg.teams[hi][1],
        awayTeam: cfg.teams[ai][0],
        awayCode: cfg.teams[ai][1],
        homeScore,
        awayScore,
        status,
        time,
        minute,
        source: 'fallback'
      });
      id++;
    }
  });

  return matches;
}

// ============================================================
// MAIN DATA LOADING
// ============================================================
async function loadMatches() {
  const dateStr = getDateStr(currentDate);
  showLoadingState();

  let apiMatches = await fetchFromAPI(dateStr);

  if (!apiMatches) {
    matchData = generateFallbackMatches(currentDate);
  } else {
    matchData = apiMatches;
  }

  applyFilters();
  updateLiveCount();
  updateDateButtons();
}

// ============================================================
// FILTERING & RENDERING
// ============================================================
function applyFilters() {
  filteredMatches = matchData.filter(m => {
    if (currentLeagueFilter !== 'all' && m.league !== currentLeagueFilter) return false;
    if (currentFilter === 'live' && m.status !== 'live') return false;
    if (currentFilter === 'finished' && m.status !== 'finished') return false;
    if (currentFilter === 'upcoming' && m.status !== 'upcoming') return false;
    if (currentSearchQuery) {
      const q = currentSearchQuery.toLowerCase();
      if (!m.homeTeam.toLowerCase().includes(q) &&
          !m.awayTeam.toLowerCase().includes(q) &&
          !m.league.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById('matchesContent');
  if (filteredMatches.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚽</div><p>Bu tarihte maç bulunamadı</p></div>`;
    return;
  }

  const byLeague = {};
  filteredMatches.forEach(m => {
    if (!byLeague[m.league]) byLeague[m.league] = [];
    byLeague[m.league].push(m);
  });

  const leagueOrder = Object.keys(byLeague).sort((a,b) => {
    const aLive = byLeague[a].filter(m=>m.status==='live').length;
    const bLive = byLeague[b].filter(m=>m.status==='live').length;
    return bLive - aLive;
  });

  let html = '';
  leagueOrder.forEach(league => {
    const info = LEAGUES[league] || { flag:'🏆', country:'' };
    const matches = byLeague[league];
    const liveCount = matches.filter(m=>m.status==='live').length;

    html += `<div class="league-block">
      <div class="league-header" onclick="toggleLeague(this)">
        <span class="league-flag">${info.flag}</span>
        <div>
          <div class="league-name">${league}</div>
          <div class="league-country">${info.country}</div>
        </div>
        <div class="league-meta">
          ${liveCount > 0 ? `<span class="league-live-count">🔴 ${liveCount} CANLI</span>` : ''}
          <span class="chevron open">▼</span>
        </div>
      </div>
      <div class="league-matches">`;

    matches.forEach(m => {
      html += renderMatchRow(m);
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function renderMatchRow(m) {
  const isLive = m.status === 'live';
  const isFinished = m.status === 'finished';
  const isUpcoming = m.status === 'upcoming';

  let timeHtml = '';
  if (isLive) {
    timeHtml = `<div class="match-time live"><div class="live-dot" style="margin:0 auto 3px;"></div>${m.minute}'</div>`;
  } else {
    timeHtml = `<div class="match-time">${m.time}</div>`;
  }

  const scoreHtml = isUpcoming
    ? `<div class="score-box"><div class="score-text">-</div></div>`
    : `<div class="score-box"><div class="score-text ${isLive?'live':''}">${m.homeScore} : ${m.awayScore}</div></div>`;

  let statusBadge = '';
  if (isFinished) statusBadge = `<span class="status-badge status-finished">MS</span>`;
  else if (isLive) statusBadge = `<span class="status-badge status-live">🔴</span>`;
  else statusBadge = `<span class="status-badge status-upcoming">⏳</span>`;

  return `<div class="match-row ${isLive?'live-match':''}" onclick='openMatch("${m.id}")'>
    ${timeHtml}
    <div class="team-row">
      <div class="team-logo">${(m.homeCode||'??').substring(0,2)}</div>
      <div class="team-name">${m.homeTeam}</div>
    </div>
    ${scoreHtml}
    <div class="team-row away">
      <div class="team-logo">${(m.awayCode||'??').substring(0,2)}</div>
      <div class="team-name">${m.awayTeam}</div>
    </div>
    <div class="match-status">${statusBadge}</div>
  </div>`;
}

function showLoadingState() {
  document.getElementById('matchesContent').innerHTML =
    `<div class="loading-shimmer"></div>`.repeat(6) +
    `<div style="text-align:center;padding:12px;font-size:12px;color:var(--text-muted);">Maçlar yükleniyor...</div>`;
}

// ============================================================
// MODAL FUNCTIONS
// ============================================================
function openMatch(id) {
  const match = matchData.find(m => String(m.id) === String(id));
  if (!match) return;
  currentModalMatch = match;
  currentModalTab = 'events';

  document.getElementById('modalLeagueName').textContent = LEAGUES[match.league]?.flag + ' ' + match.league;
  document.getElementById('modalDate').textContent = getDateLabel();
  document.getElementById('modalHome').textContent = match.homeTeam;
  document.getElementById('modalAway').textContent = match.awayTeam;

  const scoreEl = document.getElementById('modalScore');
  if (match.status === 'upcoming') {
    scoreEl.textContent = 'vs';
    scoreEl.style.fontSize = '28px';
  } else {
    scoreEl.textContent = match.homeScore + ' - ' + match.awayScore;
    scoreEl.style.fontSize = '';
    if (match.status === 'live') scoreEl.classList.add('live');
    else scoreEl.classList.remove('live');
  }

  let statusText = '';
  if (match.status === 'live') statusText = `🔴 ${match.minute}' - CANLI`;
  else if (match.status === 'finished') statusText = `✅ Maç Sona Erdi`;
  else statusText = `🕐 ${match.time}`;
  document.getElementById('modalStatusRow').textContent = statusText;

  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.modal-tab')[0].classList.add('active');

  switchModalTab('events', null);
  document.getElementById('matchModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchModalTab(tab, btn) {
  currentModalTab = tab;
  if (btn) {
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
  }
  renderModalContent(tab);
}

function renderModalContent(tab) {
  const match = currentModalMatch;
  if (!match) return;
  const container = document.getElementById('modalContent');

  if (tab === 'events') {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚽</div><p>Detaylı olaylar birazdan eklenecek</p></div>`;
  } else if (tab === 'lineup') {
    container.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>Kadro bilgisi birazdan eklenecek</p></div>`;
  } else if (tab === 'stats') {
    container.innerHTML = `<div class="empty-state"><div class="icon">📊</div><p>İstatistik bilgisi birazdan eklenecek</p></div>`;
  }
}

function closeModal(e) {
  if (e.target.id === 'matchModal') closeModalBtn();
}

function closeModalBtn() {
  document.getElementById('matchModal').classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
// STANDINGS (PLACEHOLDER)
// ============================================================
function renderStandings(group) {
  document.getElementById('standingsContent').innerHTML = 
    `<div class="empty-state"><div class="icon">🏆</div><p>Puan durumu bilgisi hazırlanıyor...</p></div>`;
}

// ============================================================
// UI CONTROLS
// ============================================================
function toggleLeague(header) {
  const matchesEl = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  const isOpen = matchesEl.style.display !== 'none';
  matchesEl.style.display = isOpen ? 'none' : 'block';
  chevron.classList.toggle('open', !isOpen);
}

function selectDate(offset) {
  currentDate = offset;
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  const btnMap = { '-1': 'btn-yesterday', '0': 'btn-today', '1': 'btn-tomorrow' };
  document.getElementById(btnMap[offset]).classList.add('active');
  loadMatches();
}

function updateDateButtons() {
  const now = new Date();
  const dates = {
    '-1': new Date(now.getTime() - 86400000),
    '0': now,
    '1': new Date(now.getTime() + 86400000)
  };
  const btnMap = { '-1': 'btn-yesterday', '0': 'btn-today', '1': 'btn-tomorrow' };
  const labels = { '-1': 'Dün', '0': 'Bugün', '1': 'Yarın' };

  Object.keys(dates).forEach(offset => {
    const d = dates[offset];
    const btn = document.getElementById(btnMap[offset]);
    btn.textContent = offset === '0' ? 'Bugün' : labels[offset] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
  });
}

function filterLeague(league) {
  currentLeagueFilter = league;
  document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
  event.currentTarget.classList.add('active');
  applyFilters();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterMatches(query) {
  currentSearchQuery = query;
  applyFilters();
}

function switchMainTab(tab, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const mc = document.getElementById('matchesContainer');
  const sc = document.getElementById('standingsContainer');

  if (tab === 'matches') {
    mc.style.display = 'block';
    sc.style.display = 'none';
  } else {
    mc.style.display = 'none';
    sc.style.display = 'block';
    renderStandings(currentStandingsGroup);
  }
}

function selectStandingsGroup(group, btn) {
  currentStandingsGroup = group;
  document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStandings(group);
}

function toggleTheme() {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle('light-theme', isLightTheme);
  document.getElementById('themeBtn').textContent = isLightTheme ? '☀️' : '🌙';
}

function updateLiveCount() {
  const count = matchData.filter(m => m.status === 'live').length;
  document.getElementById('liveCount').textContent = count + ' CANLI';
}

// ============================================================
// INITIALIZATION
// ============================================================
document.getElementById('standingsContainer').style.display = 'none';
updateDateButtons();
loadMatches();

// Auto-refresh every 30 seconds for live matches
setInterval(loadMatches, 30000);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalBtn();
});
</script>
</body>
</html>
